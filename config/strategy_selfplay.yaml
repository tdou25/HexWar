# mlagents-learn config/strategy_selfplay.yaml --run-id=hex1 --env=Build/HexWar --num-envs=8 --time-scale=20 --no-graphics
# (or press Play in the editor after starting mlagents-learn without --env; scene can be EMPTY)
behaviors:
  Strategy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3            # keep some entropy: 99-way masked action space
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true          # observations are already ~[0,1], but running-norm is cheap insurance
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999           # 1440-step games with sparse big rewards -> long horizon
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 20000
    self_play:
      save_steps: 20000
      team_change: 200000
      swap_steps: 10000        # 1 step = 1 game hour; swap opponent snapshot every ~7 games
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
